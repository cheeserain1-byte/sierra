<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>梦角传讯 · Dream Phone</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--c1:#CAE0E8;--c2:#A5CAD4;--c3:#9F8F82;--c4:#FFFFFF;
--ink:#2F3E46;--ink2:#5D7079;--ink3:#8DA0A9;
--accent:#4E7A8A;--accent2:#7A6B5E;
--glass-line:rgba(255,255,255,.9);
--shadow:rgba(90,125,140,.32);
--glass-op:.55;--glass-blur:30px;
--r-lg:26px;--r-md:18px;
}
html,body{height:100%;overflow:hidden;background:#0d1418;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
color:var(--ink);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(90,125,140,.25);border-radius:2px}
button,input,textarea,select{font-family:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
img{display:block;max-width:100%}
body{display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:min(430px,100vw);height:min(920px,100dvh);background:#000;overflow:hidden}
@media(min-width:520px) and (min-height:760px){
.phone{width:402px;height:min(872px,94dvh);border-radius:52px;padding:9px;
background:linear-gradient(150deg,#3a4048,#151a1e 45%,#242a30);
box-shadow:0 60px 120px -30px rgba(80,120,140,.55),0 0 0 1px rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.06)}
.phone::after{content:'';position:absolute;inset:9px;border-radius:44px;pointer-events:none;box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.1)}
.screen{border-radius:44px!important}
.notch{display:block!important}
}
.notch{display:none;position:absolute;top:18px;left:50%;transform:translateX(-50%);width:104px;height:24px;background:#000;border-radius:14px;z-index:90}
.screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(90% 58% at 6% -6%,rgba(255,255,255,.96),transparent 56%),
radial-gradient(80% 55% at 103% 103%,var(--c2),transparent 66%),
linear-gradient(168deg,#EEF6F9 0%,var(--c1) 42%,#B4D2DD 100%);
background-size:cover;background-position:center;transition:background-image .4s}
.statusbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
padding:15px 30px 4px;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:.2px;position:relative;z-index:30}
.sb-icons{display:flex;align-items:center;gap:5px}
.sb-ico{display:block;color:var(--ink)}
.sb-batt{width:23px;height:11.5px;border:1.4px solid rgba(47,62,70,.45);border-radius:3.6px;position:relative}
.sb-batt::after{content:'';position:absolute;right:-3.6px;top:3px;width:2px;height:5.5px;background:rgba(47,62,70,.45);border-radius:0 2px 2px 0}
.sb-batt i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:72%;background:var(--ink);border-radius:2px;display:block}
.views{position:relative;flex:1;min-height:0;z-index:10;padding-bottom:88px}
.view{position:absolute;inset:0}
.view.home{display:flex;flex-direction:column;overflow:hidden;transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .3s,filter .3s}
.view.home.hidden{transform:scale(.94) translateX(-8%);opacity:0;pointer-events:none;filter:blur(2px)}
.view.app{display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .28s}
.view.app.active{transform:translateX(0);opacity:1;pointer-events:auto}
.glass{position:relative;
background:linear-gradient(152deg,rgba(255,255,255,calc(var(--glass-op) + .2)) 0%,rgba(255,255,255,var(--glass-op)) 42%,rgba(255,255,255,calc(var(--glass-op) + .05)) 100%);
border:1px solid var(--glass-line);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
box-shadow:0 14px 34px -16px var(--shadow),0 2px 8px -4px rgba(90,125,140,.18),inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 1px rgba(255,255,255,.55)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%);z-index:0}
.widget-zone{flex:0 0 40%;min-height:0;padding:8px 18px 0;display:flex}
.widget{flex:1;min-height:0;border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;overflow:hidden;
background-size:cover;background-position:center;background-repeat:no-repeat}
.widget > *{position:relative;z-index:1}
.w-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:2.4px;color:var(--ink3);font-weight:600;position:relative;z-index:2;margin-bottom:2px}
.w-gear{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:.18s}
.w-gear:hover{background:rgba(255,255,255,.6);color:var(--accent)}
.w-gear:active{transform:scale(.88)}
.arrive-row{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:12px;
background:linear-gradient(100deg,rgba(202,224,232,.85),rgba(255,255,255,.7));
border:1px solid rgba(255,255,255,.95);font-size:11.5px;color:var(--ink);font-weight:500;
margin-bottom:8px;position:relative;z-index:2;box-shadow:0 6px 16px -8px rgba(90,125,140,.5);
animation:arriveIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes arriveIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.arrive-row .dot{width:6px;height:6px;border-radius:50%;background:#5FBF9A;flex:none;box-shadow:0 0 0 3px rgba(95,191,154,.22);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 3px rgba(95,191,154,.22)}50%{box-shadow:0 0 0 6px rgba(95,191,154,.06)}}
.w-pair{flex:1;min-height:0;display:flex;align-items:center;gap:6px;position:relative;z-index:2}
.w-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.w-side .ava{width:50px;height:50px;font-size:19px}
.w-name{font-size:12.5px;font-weight:600;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-state{font-size:10.5px;color:var(--ink2);line-height:1.45;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.w-heart{flex:none;display:flex;align-items:center;justify-content:center;animation:beat 2s ease-in-out infinite;color:#D98A9A;filter:drop-shadow(0 2px 6px rgba(200,120,140,.5))}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}26%{transform:scale(1)}40%{transform:scale(1.12)}}
.w-ann{display:flex;gap:6px;margin-top:8px;padding-top:9px;border-top:1px solid rgba(255,255,255,.65);
overflow-x:auto;overflow-y:hidden;position:relative;z-index:2;flex-shrink:0;scrollbar-width:none}
.w-ann::-webkit-scrollbar{display:none}
.ann-pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 4px;border-radius:11px;
background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);
flex:none;font-size:10.5px;color:var(--ink2);white-space:nowrap;
box-shadow:0 4px 10px -6px var(--shadow),inset 0 1px 0 #fff}
.ann-pill .num{font-weight:700;color:var(--accent);font-size:11px;font-variant-numeric:tabular-nums}
.app-zone{flex:1;min-height:0;padding:0 18px 6px;display:flex;flex-direction:column;justify-content:center}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;align-content:center}
.app-btn{display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .18s cubic-bezier(.2,.9,.3,1.4)}
.app-btn:active{transform:scale(.88)}
.app-icon{width:62px;height:62px;border-radius:19px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
background:linear-gradient(150deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.62) 48%,rgba(255,255,255,.78) 100%);
border:1px solid rgba(255,255,255,.98);backdrop-filter:blur(22px) saturate(200%);-webkit-backdrop-filter:blur(22px) saturate(200%);
box-shadow:0 10px 22px -10px var(--shadow),0 2px 5px -2px rgba(90,125,140,.2),inset 0 1px 0 #fff,inset 0 -8px 16px -10px rgba(255,255,255,.9)}
.app-icon::before{content:'';position:absolute;top:0;left:0;right:0;height:52%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none;border-radius:inherit;z-index:1}
.app-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.app-icon svg{position:relative;z-index:2}
.app-label{font-size:10.5px;color:var(--ink2);letter-spacing:.2px;font-weight:500;text-align:center}
.app-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 16px 12px;position:relative;z-index:20}
.app-title{flex:1;font-size:16.5px;font-weight:600;color:var(--ink);letter-spacing:.4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
display:flex;align-items:center;justify-content:center;gap:7px}
.app-title.clickable{cursor:pointer;transition:.2s;border-radius:12px;padding:4px 10px}
.app-title.clickable:hover{background:rgba(255,255,255,.6)}
.bar-btn{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:.18s;position:relative}
.bar-btn:hover{background:rgba(255,255,255,.7)}
.bar-btn:active{transform:scale(.88)}
.app-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 30px;position:relative;z-index:10}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 17px;border-radius:14px;font-size:13.5px;font-weight:500;
background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:var(--ink);transition:.16s;
box-shadow:0 4px 12px -6px var(--shadow),inset 0 1px 0 #fff}
.btn:hover{background:rgba(255,255,255,.92)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(150deg,var(--c2),var(--accent));border-color:rgba(255,255,255,.4);color:#fff;
box-shadow:0 10px 24px -12px rgba(78,122,138,.9),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.danger{background:rgba(200,120,130,.16);color:#A05A66;border-color:rgba(200,120,130,.25)}
.btn.ghost{background:rgba(255,255,255,.42)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:11px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:8px;letter-spacing:.7px;font-weight:600;text-transform:uppercase}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
width:100%;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);border-radius:14px;
padding:12px 15px;color:var(--ink);font-size:14px;line-height:1.6;transition:border .2s,background .2s;
box-shadow:inset 0 1px 2px rgba(90,125,140,.06)}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--c2);background:rgba(255,255,255,.9)}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.85;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.ava{border-radius:50%;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
color:#fff;font-weight:600;overflow:hidden;user-select:none;background-image:linear-gradient(145deg,var(--c2),var(--accent));
box-shadow:0 4px 12px -5px var(--shadow),inset 0 1px 0 rgba(255,255,255,.4)}
.ava.a20{width:22px;height:22px;font-size:9.5px}
.ava.a26{width:26px;height:26px;font-size:11px}
.ava.a34{width:34px;height:34px;font-size:13px}
.ava.a40{width:40px;height:40px;font-size:15px}
.ava.a50{width:50px;height:50px;font-size:19px}
.ava.a56{width:56px;height:56px;font-size:21px}
.ava.a64{width:64px;height:64px;font-size:24px}
.empty{text-align:center;padding:56px 20px;color:var(--ink3);font-size:12.5px;line-height:2.1}
.empty .em{font-size:38px;opacity:.32;margin-bottom:14px;display:block;color:var(--accent)}
.chat-list{padding:2px 0}
.chat-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:18px;transition:.16s;cursor:pointer;margin-bottom:2px}
.chat-row:hover{background:rgba(255,255,255,.62)}
.chat-row:active{background:rgba(255,255,255,.8)}
.chat-row .info{flex:1;min-width:0}
.chat-row .nm{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chat-row .nm small{font-size:10.5px;color:var(--ink3);font-weight:400}
.chat-row .pv{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.chat-row .meta{text-align:right;flex:none;font-size:10.5px;color:var(--ink3);line-height:1.5}
.chat-row .unread{width:8px;height:8px;border-radius:50%;background:var(--c3);margin:5px auto 0;box-shadow:0 0 0 3px rgba(159,143,130,.16)}
.conv{display:flex;flex-direction:column;height:100%;margin:0 -18px;padding:0 18px}
.msgs{flex:1;overflow-y:auto;padding:10px 0 14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%;animation:pop .32s cubic-bezier(.2,.9,.3,1.25)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.them{align-self:flex-start}
.bubble{padding:10px 15px;border-radius:20px;font-size:14px;line-height:1.62;word-break:break-word;white-space:pre-wrap}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.msgs.bs-ios .msg.me .bubble{background:linear-gradient(150deg,var(--c2),var(--accent));color:#fff;border-bottom-right-radius:7px;
box-shadow:0 8px 20px -12px rgba(78,122,138,.95),inset 0 1px 0 rgba(255,255,255,.3)}
.msgs.bs-ios .msg.them .bubble{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);color:var(--ink);border-bottom-left-radius:7px;
box-shadow:0 6px 16px -10px var(--shadow),inset 0 1px 0 #fff}
.msgs.bs-wechat .msg.me .bubble{background:#95EC69;color:#1A1A1A;border-radius:5px;border:1px solid #7BD152}
.msgs.bs-wechat .msg.them .bubble{background:#FFFFFF;color:#1A1A1A;border-radius:5px;border:1px solid #E4E4E4}
.msgs.bs-glass .msg.me .bubble{background:linear-gradient(150deg,rgba(202,224,232,.95),rgba(165,202,212,.85));color:var(--ink);
border:1px solid rgba(255,255,255,.95);border-bottom-right-radius:7px;backdrop-filter:blur(12px);
box-shadow:0 8px 20px -12px var(--shadow),inset 0 1px 0 #fff}
.msgs.bs-glass .msg.them .bubble{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);color:var(--ink);
border-bottom-left-radius:7px;backdrop-filter:blur(12px);box-shadow:0 6px 16px -10px var(--shadow),inset 0 1px 0 #fff}
.msgs.bs-minimal .msg.me .bubble{background:var(--accent);color:#fff;border-radius:14px}
.msgs.bs-minimal .msg.them .bubble{background:transparent;border:1.4px solid var(--c2);color:var(--ink);border-radius:14px}
.msgs.bs-soft .msg.me .bubble{background:linear-gradient(150deg,#F0D9DC,#E3BDC4);color:#5C3B42;border-bottom-right-radius:7px;
box-shadow:0 8px 20px -14px rgba(180,120,130,.8)}
.msgs.bs-soft .msg.them .bubble{background:linear-gradient(150deg,#FFFFFF,#F4EFF0);color:#5C4B4E;border-bottom-left-radius:7px;
border:1px solid rgba(255,255,255,.95);box-shadow:0 6px 16px -10px rgba(180,120,130,.35)}
.msg-del{opacity:0;width:22px;height:22px;flex:none;border-radius:50%;background:rgba(200,90,110,.75);color:#fff;font-size:13px;
display:flex;align-items:center;justify-content:center;transition:.2s;align-self:center;cursor:pointer;border:none}
.msg:hover .msg-del{opacity:.85}
.msg-del:hover{background:rgba(180,70,90,.95);transform:scale(1.1)}
.reroll{opacity:0;width:24px;height:24px;flex:none;border-radius:50%;background:rgba(255,255,255,.72);color:var(--accent);font-size:12px;
align-self:center;transition:.22s;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px -4px var(--shadow)}
.msg.them:hover .reroll{opacity:.85}
.reroll:hover{background:#fff;opacity:1!important;transform:rotate(100deg)}
.quote-block{padding:6px 10px;border-left:3px solid var(--accent);background:rgba(255,255,255,.35);
border-radius:6px;font-size:12px;color:var(--ink3);margin-bottom:6px;line-height:1.4;
overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.bubble.typing{display:inline-flex;align-items:center;gap:6px;padding:10px 15px}
.bubble.typing .tlabel{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.bubble.typing .dots{display:inline-flex;gap:3px;align-items:center}
.bubble.typing .dots span{display:block;width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:bnc 1.2s infinite}
.bubble.typing .dots span:nth-child(2){animation-delay:.15s}
.bubble.typing .dots span:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.sys-msg{align-self:center;font-size:11px;color:var(--ink3);background:rgba(255,255,255,.5);
padding:4px 12px;border-radius:10px;max-width:80%;text-align:center;line-height:1.6;
border:1px solid rgba(255,255,255,.7);animation:pop .3s}
.sticker-img{width:104px;height:104px;object-fit:cover;border-radius:14px;display:block;box-shadow:0 6px 16px -8px var(--shadow)}
.composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 0 10px;border-top:1px solid rgba(90,125,140,.12);background:rgba(244,247,249,.55)}
.wx-plus{width:38px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:26px;font-weight:300;line-height:1;transition:.15s;border-radius:50%}
.wx-plus:active{transform:scale(.9);background:rgba(0,0,0,.05)}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:110px;height:42px;
background:#fff;border:1px solid rgba(0,0,0,.04);border-radius:8px;
padding:10px 13px;font-size:14.5px;line-height:1.4;overflow-y:auto;color:var(--ink);
box-shadow:inset 0 1px 1px rgba(0,0,0,.02)}
.composer textarea::placeholder{color:#B8BFC4}
.wx-send{height:42px;padding:0 16px;flex:none;border-radius:8px;background:#07C160;color:#fff;font-size:14.5px;font-weight:500;transition:.15s;border:none;cursor:pointer;min-width:62px}
.wx-send:active{background:#06AD56;transform:scale(.97)}
.wx-send:disabled{background:#DCDCDC;color:#999;cursor:not-allowed}
.sticker-panel{position:absolute;left:0;right:0;bottom:0;z-index:60;
background:linear-gradient(170deg,rgba(255,255,255,.98),rgba(240,247,250,.97));
border-radius:22px 22px 0 0;border-top:1px solid #fff;
box-shadow:0 -14px 40px -16px rgba(90,125,140,.5);
transform:translateY(100%);transition:transform .32s cubic-bezier(.3,.9,.3,1);
max-height:56%;display:flex;flex-direction:column}
.sticker-panel.show{transform:none}
.sp-head{display:flex;align-items:center;gap:10px;padding:13px 18px 10px;border-bottom:1px solid rgba(90,125,140,.1)}
.sp-head .t{flex:1;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.4px}
.sp-count{font-size:11px;color:var(--ink3)}
.sp-body{flex:1;overflow-y:auto;padding:12px 16px 18px}
.sp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sp-item{aspect-ratio:1;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.7);
border:1px solid rgba(255,255,255,.9);cursor:pointer;transition:.16s;position:relative;
box-shadow:0 4px 10px -6px var(--shadow)}
.sp-item:hover{transform:translateY(-2px)}
.sp-item img{width:100%;height:100%;object-fit:cover}

.app-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 30px;position:relative;z-index:10}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 17px;border-radius:14px;font-size:13.5px;font-weight:500;
background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:var(--ink);transition:.16s;
box-shadow:0 4px 12px -6px var(--shadow),inset 0 1px 0 #fff}
.btn:hover{background:rgba(255,255,255,.92)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(150deg,var(--c2),var(--accent));border-color:rgba(255,255,255,.4);color:#fff;
box-shadow:0 10px 24px -12px rgba(78,122,138,.9),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.danger{background:rgba(200,120,130,.16);color:#A05A66;border-color:rgba(200,120,130,.25)}
.btn.ghost{background:rgba(255,255,255,.42)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:11px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:8px;letter-spacing:.7px;font-weight:600;text-transform:uppercase}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
width:100%;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);border-radius:14px;
padding:12px 15px;color:var(--ink);font-size:14px;line-height:1.6;transition:border .2s,background .2s;
box-shadow:inset 0 1px 2px rgba(90,125,140,.06)}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--c2);background:rgba(255,255,255,.9)}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.85;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.ava{border-radius:50%;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
color:#fff;font-weight:600;overflow:hidden;user-select:none;background-image:linear-gradient(145deg,var(--c2),var(--accent));
box-shadow:0 4px 12px -5px var(--shadow),inset 0 1px 0 rgba(255,255,255,.4)}
.ava.a20{width:22px;height:22px;font-size:9.5px}
.ava.a26{width:26px;height:26px;font-size:11px}
.ava.a34{width:34px;height:34px;font-size:13px}
.ava.a40{width:40px;height:40px;font-size:15px}
.ava.a50{width:50px;height:50px;font-size:19px}
.ava.a56{width:56px;height:56px;font-size:21px}
.ava.a64{width:64px;height:64px;font-size:24px}
.empty{text-align:center;padding:56px 20px;color:var(--ink3);font-size:12.5px;line-height:2.1}
.empty .em{font-size:38px;opacity:.32;margin-bottom:14px;display:block;color:var(--accent)}
.chat-list{padding:2px 0}
.chat-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:18px;transition:.16s;cursor:pointer;margin-bottom:2px}
.chat-row:hover{background:rgba(255,255,255,.62)}
.chat-row:active{background:rgba(255,255,255,.8)}
.chat-row .info{flex:1;min-width:0}
.chat-row .nm{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chat-row .nm small{font-size:10.5px;color:var(--ink3);font-weight:400}
.chat-row .pv{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.chat-row .meta{text-align:right;flex:none;font-size:10.5px;color:var(--ink3);line-height:1.5}
.chat-row .unread{width:8px;height:8px;border-radius:50%;background:var(--c3);margin:5px auto 0;box-shadow:0 0 0 3px rgba(159,143,130,.16)}
.conv{display:flex;flex-direction:column;height:100%;margin:0 -18px;padding:0 18px}
.msgs{flex:1;overflow-y:auto;padding:10px 0 14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%;animation:pop .32s cubic-bezier(.2,.9,.3,1.25)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.them{align-self:flex-start}
.bubble{padding:10px 15px;border-radius:20px;font-size:14px;line-height:1.62;word-break:break-word;white-space:pre-wrap}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.msgs.bs-ios .msg.me .bubble{background:linear-gradient(150deg,var(--c2),var(--accent));color:#fff;border-bottom-right-radius:7px;
box-shadow:0 8px 20px -12px rgba(78,122,138,.95),inset 0 1px 0 rgba(255,255,255,.3)}
.msgs.bs-ios .msg.them .bubble{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);color:var(--ink);border-bottom-left-radius:7px;
box-shadow:0 6px 16px -10px var(--shadow),inset 0 1px 0 #fff}
.msgs.bs-wechat .msg.me .bubble{background:#95EC69;color:#1A1A1A;border-radius:5px;border:1px solid #7BD152}
.msgs.bs-wechat .msg.them .bubble{background:#FFFFFF;color:#1A1A1A;border-radius:5px;border:1px solid #E4E4E4}
.msgs.bs-glass .msg.me .bubble{background:linear-gradient(150deg,rgba(202,224,232,.95),rgba(165,202,212,.85));color:var(--ink);
border:1px solid rgba(255,255,255,.95);border-bottom-right-radius:7px;backdrop-filter:blur(12px);
box-shadow:0 8px 20px -12px var(--shadow),inset 0 1px 0 #fff}
.msgs.bs-glass .msg.them .bubble{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);color:var(--ink);
border-bottom-left-radius:7px;backdrop-filter:blur(12px);box-shadow:0 6px 16px -10px var(--shadow),inset 0 1px 0 #fff}
.msgs.bs-minimal .msg.me .bubble{background:var(--accent);color:#fff;border-radius:14px}
.msgs.bs-minimal .msg.them .bubble{background:transparent;border:1.4px solid var(--c2);color:var(--ink);border-radius:14px}
.msgs.bs-soft .msg.me .bubble{background:linear-gradient(150deg,#F0D9DC,#E3BDC4);color:#5C3B42;border-bottom-right-radius:7px;
box-shadow:0 8px 20px -14px rgba(180,120,130,.8)}
.msgs.bs-soft .msg.them .bubble{background:linear-gradient(150deg,#FFFFFF,#F4EFF0);color:#5C4B4E;border-bottom-left-radius:7px;
border:1px solid rgba(255,255,255,.95);box-shadow:0 6px 16px -10px rgba(180,120,130,.35)}
.msg-del{opacity:0;width:22px;height:22px;flex:none;border-radius:50%;background:rgba(200,90,110,.75);color:#fff;font-size:13px;
display:flex;align-items:center;justify-content:center;transition:.2s;align-self:center;cursor:pointer;border:none}
.msg:hover .msg-del{opacity:.85}
.msg-del:hover{background:rgba(180,70,90,.95);transform:scale(1.1)}
.reroll{opacity:0;width:24px;height:24px;flex:none;border-radius:50%;background:rgba(255,255,255,.72);color:var(--accent);font-size:12px;
align-self:center;transition:.22s;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px -4px var(--shadow)}
.msg.them:hover .reroll{opacity:.85}
.reroll:hover{background:#fff;opacity:1!important;transform:rotate(100deg)}
.quote-block{padding:6px 10px;border-left:3px solid var(--accent);background:rgba(255,255,255,.35);
border-radius:6px;font-size:12px;color:var(--ink3);margin-bottom:6px;line-height:1.4;
overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.bubble.typing{display:inline-flex;align-items:center;gap:6px;padding:10px 15px}
.bubble.typing .tlabel{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.bubble.typing .dots{display:inline-flex;gap:3px;align-items:center}
.bubble.typing .dots span{display:block;width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:bnc 1.2s infinite}
.bubble.typing .dots span:nth-child(2){animation-delay:.15s}
.bubble.typing .dots span:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.sys-msg{align-self:center;font-size:11px;color:var(--ink3);background:rgba(255,255,255,.5);
padding:4px 12px;border-radius:10px;max-width:80%;text-align:center;line-height:1.6;
border:1px solid rgba(255,255,255,.7);animation:pop .3s}
.sticker-img{width:104px;height:104px;object-fit:cover;border-radius:14px;display:block;box-shadow:0 6px 16px -8px var(--shadow)}
.composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 0 10px;border-top:1px solid rgba(90,125,140,.12);background:rgba(244,247,249,.55)}
.wx-plus{width:38px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:26px;font-weight:300;line-height:1;transition:.15s;border-radius:50%}
.wx-plus:active{transform:scale(.9);background:rgba(0,0,0,.05)}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:110px;height:42px;
background:#fff;border:1px solid rgba(0,0,0,.04);border-radius:8px;
padding:10px 13px;font-size:14.5px;line-height:1.4;overflow-y:auto;color:var(--ink);
box-shadow:inset 0 1px 1px rgba(0,0,0,.02)}
.composer textarea::placeholder{color:#B8BFC4}
.wx-send{height:42px;padding:0 16px;flex:none;border-radius:8px;background:#07C160;color:#fff;font-size:14.5px;font-weight:500;transition:.15s;border:none;cursor:pointer;min-width:62px}
.wx-send:active{background:#06AD56;transform:scale(.97)}
.wx-send:disabled{background:#DCDCDC;color:#999;cursor:not-allowed}
.sticker-panel{position:absolute;left:0;right:0;bottom:0;z-index:60;
background:linear-gradient(170deg,rgba(255,255,255,.98),rgba(240,247,250,.97));
border-radius:22px 22px 0 0;border-top:1px solid #fff;
box-shadow:0 -14px 40px -16px rgba(90,125,140,.5);
transform:translateY(100%);transition:transform .32s cubic-bezier(.3,.9,.3,1);
max-height:56%;display:flex;flex-direction:column}
.sticker-panel.show{transform:none}
.sp-head{display:flex;align-items:center;gap:10px;padding:13px 18px 10px;border-bottom:1px solid rgba(90,125,140,.1)}
.sp-head .t{flex:1;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.4px}
.sp-count{font-size:11px;color:var(--ink3)}
.sp-body{flex:1;overflow-y:auto;padding:12px 16px 18px}
.sp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sp-item{aspect-ratio:1;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.7);
border:1px solid rgba(255,255,255,.9);cursor:pointer;transition:.16s;position:relative;
box-shadow:0 4px 10px -6px var(--shadow)}
.sp-item:hover{transform:translateY(-2px)}
.sp-item img{width:100%;height:100%;object-fit:cover}
.sp-item .del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
background:rgba(200,90,110,.85);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center}
.sp-item:hover .del{display:flex}
.sp-actions{padding:10px 16px 16px;border-top:1px solid rgba(90,125,140,.1);display:flex;gap:8px;align-items:center}
.call-overlay{position:absolute;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;
padding:40px 24px;background:linear-gradient(175deg,#3D5866,#1E2C36 70%);color:#fff}
.call-overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.call-ava{width:112px;height:112px;font-size:40px;margin-bottom:22px;
box-shadow:0 20px 50px -20px rgba(0,0,0,.8),0 0 0 6px rgba(255,255,255,.08)}
.call-name{font-size:24px;font-weight:600;letter-spacing:.6px;margin-bottom:10px;text-align:center}
.call-sub{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:1.6px;margin-bottom:8px}
.call-timer{font-size:15px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;letter-spacing:1.5px;margin-bottom:44px}
.call-actions{display:flex;gap:56px;align-items:center}
.call-btn{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;
color:#fff;transition:.18s;box-shadow:0 12px 28px -12px rgba(0,0,0,.7);border:none}
.call-btn:active{transform:scale(.9)}
.call-btn.decline{background:linear-gradient(150deg,#E8748A,#C9556B)}
.call-btn.accept{background:linear-gradient(150deg,#6BD9A0,#3FA878);animation:ring 1.6s infinite}
@keyframes ring{0%,100%{box-shadow:0 12px 28px -12px rgba(0,0,0,.7),0 0 0 0 rgba(107,217,160,.5)}50%{box-shadow:0 12px 28px -12px rgba(0,0,0,.7),0 0 0 14px rgba(107,217,160,0)}}
.call-ended{position:absolute;inset:0;z-index:210;display:none;flex-direction:column;align-items:center;justify-content:center;
padding:40px 24px;background:linear-gradient(175deg,#3D5866,#1E2C36 70%);color:#fff;animation:fadeIn .3s}
.call-ended.show{display:flex}
.call-ended .ce-ava{width:96px;height:96px;font-size:34px;margin-bottom:18px;opacity:.65}
.call-ended .ce-name{font-size:20px;font-weight:500;margin-bottom:14px;opacity:.9}
.call-ended .ce-info{font-size:13px;color:rgba(255,255,255,.5);letter-spacing:.4px;margin-bottom:44px}
.call-ended .ce-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:26px;
padding:12px 32px;color:#fff;font-size:14px;letter-spacing:.5px;transition:.18s}
.call-ended .ce-btn:active{transform:scale(.95);background:rgba(255,255,255,.22)}
.home-pop{position:absolute;left:16px;right:16px;top:44px;z-index:70;
border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;
background:linear-gradient(150deg,rgba(255,255,255,.96),rgba(240,247,250,.92));
border:1px solid #fff;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
box-shadow:0 20px 44px -18px rgba(90,125,140,.7),inset 0 1px 0 #fff;
animation:popDown .45s cubic-bezier(.2,.9,.3,1.3);cursor:pointer}
@keyframes popDown{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:none}}
.home-pop .info{flex:1;min-width:0}
.home-pop .pn{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px}
.home-pop .pm{font-size:12px;color:var(--ink2);line-height:1.55}
.home-pop .close{width:22px;height:22px;border-radius:50%;background:rgba(90,125,140,.14);color:var(--ink3);
font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;align-self:flex-start}
.card-list{max-height:230px;overflow-y:auto;padding:4px 2px;margin-bottom:9px;
border-radius:14px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.8)}
.card-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:10px;transition:.14s}
.card-item:hover{background:rgba(255,255,255,.7)}
.card-idx{font-size:10.5px;color:var(--ink3);width:20px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.card-item input{flex:1;background:transparent;border:none;padding:6px 4px;font-size:13px;color:var(--ink);min-width:0}
.card-item input:focus{background:rgba(255,255,255,.85);border-radius:8px;padding:6px 8px}
.card-del{width:22px;height:22px;border-radius:50%;flex:none;color:var(--ink3);font-size:14px;
display:flex;align-items:center;justify-content:center;transition:.14s}
.card-del:hover{background:rgba(200,120,130,.2);color:#A05A66}
.batch-box{margin-top:10px;padding:11px;border-radius:14px;background:rgba(202,224,232,.35);border:1px dashed rgba(90,125,140,.25)}
.batch-box .bt{font-size:11px;color:var(--ink3);margin-bottom:8px;letter-spacing:.5px}
.dock{position:absolute;left:14px;right:14px;bottom:14px;height:70px;z-index:45;
background:rgba(255,255,255,.52);backdrop-filter:blur(28px) saturate(180%);
-webkit-backdrop-filter:blur(28px) saturate(180%);
border:1px solid rgba(255,255,255,.85);border-radius:24px;
display:flex;align-items:center;justify-content:space-around;padding:0 8px;
box-shadow:0 12px 32px -16px rgba(90,125,140,.5),inset 0 1px 0 #fff}
.dock-btn{width:60px;height:56px;border-radius:16px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:3px;color:var(--ink2);transition:.18s;cursor:pointer;background:none;border:none}
.dock-btn:hover{background:rgba(255,255,255,.6)}
.dock-btn:active{transform:scale(.9)}
.dock-btn svg{width:22px;height:22px}
.dock-btn .dl{font-size:9.5px;letter-spacing:.3px;font-weight:500}
.home-bar{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(47,62,70,.28);z-index:60;pointer-events:none}
.swatch{width:44px;height:44px;border-radius:14px;border:2px solid transparent;transition:.18s;position:relative;
box-shadow:0 6px 14px -8px var(--shadow),inset 0 1px 0 rgba(255,255,255,.4)}
.swatch.on{border-color:var(--ink);transform:scale(1.06)}
.color-pick{width:52px;height:44px;border-radius:13px;background:transparent;border:1px solid rgba(255,255,255,.9);cursor:pointer;padding:3px}
.chip{padding:8px 15px;border-radius:12px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);color:var(--ink2);transition:.16s}
.chip:hover{background:rgba(255,255,255,.95)}
.chip.on{background:linear-gradient(150deg,var(--c2),var(--accent));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 14px -8px rgba(78,122,138,.9)}
.switch{width:46px;height:28px;border-radius:15px;background:rgba(255,255,255,.62);position:relative;flex:none;transition:.26s;cursor:pointer;
border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 3px rgba(90,125,140,.14)}
.switch::after{content:'';position:absolute;top:2.5px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.26s cubic-bezier(.3,.9,.4,1.2);box-shadow:0 2px 6px rgba(90,125,140,.35)}
.switch.on{background:linear-gradient(150deg,var(--c2),var(--accent));border-color:transparent}
.switch.on::after{transform:translateX(17px)}
.code-area{width:100%;font-family:ui-monospace,Menlo,Monaco,monospace;font-size:12px;
background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:12px;
padding:11px 13px;color:var(--ink);line-height:1.6;resize:vertical;min-height:70px;transition:border .2s;letter-spacing:0}
.code-area:focus{border-color:var(--c2);background:rgba(255,255,255,.95)}
.mask{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;
background:rgba(70,100,115,.32);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%)}
.mask.show{display:flex;animation:fadeIn .24s}
.sheet{width:100%;max-width:430px;max-height:88vh;overflow-y:auto;
background:linear-gradient(170deg,rgba(255,255,255,.97),rgba(240,247,250,.95));
border-radius:32px 32px 0 0;padding:12px 22px 36px;border-top:1px solid #fff;
box-shadow:0 -20px 60px -20px rgba(90,125,140,.5),inset 0 1px 0 #fff;
animation:slideUp .38s cubic-bezier(.2,.9,.3,1.06)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:rgba(90,125,140,.22);margin:0 auto 18px}
.sheet h3{font-size:17px;font-weight:600;margin-bottom:20px;letter-spacing:.4px;color:var(--ink)}
.sheet-actions{display:flex;gap:10px;align-items:center;margin-top:24px}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,16px);z-index:300;
background:rgba(255,255,255,.94);border:1px solid #fff;color:var(--ink);
padding:12px 22px;border-radius:16px;font-size:13px;font-weight:500;
opacity:0;pointer-events:none;transition:.32s cubic-bezier(.2,.9,.3,1.2);
max-width:78vw;text-align:center;
box-shadow:0 16px 40px -16px rgba(90,125,140,.6),inset 0 1px 0 #fff;
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tarot-fan-wrap{position:relative;height:230px;overflow-x:auto;overflow-y:hidden;margin:10px -18px;padding:20px 0 10px;scrollbar-width:none}
.tarot-fan-wrap::-webkit-scrollbar{display:none}
.tarot-fan{position:relative;height:180px;width:3200px;padding:0 60px}
.fan-card{position:absolute;top:10px;width:52px;height:88px;border-radius:8px;
background:linear-gradient(140deg,#F0F6F9,#C8DCE4);border:1px solid rgba(255,255,255,.95);
box-shadow:0 5px 12px -6px var(--shadow),inset 0 1px 0 #fff;
cursor:pointer;transition:transform .25s,box-shadow .25s,top .25s;

function load(){
try{
const raw = localStorage.getItem(KEY);
if(raw) state = Object.assign(state, JSON.parse(raw));
}catch(e){ console.warn(e); }
state.chars = Array.isArray(state.chars) ? state.chars : [];
state.msgs = state.msgs || {};
state.decks = state.decks || {};
state.letters = Array.isArray(state.letters) ? state.letters : [];
state.anniversaries = Array.isArray(state.anniversaries) ? state.anniversaries : [];
state.memos = Array.isArray(state.memos) ? state.memos : [];
state.chatBg = state.chatBg || {};
state.stickers = state.stickers || {};
state.publicCards = Array.isArray(state.publicCards) ? state.publicCards : [];
state.appIcons = state.appIcons || {};
state.bubbles = Array.isArray(state.bubbles) ? state.bubbles : [];
state.theme = state.theme || { c1:'#CAE0E8', c2:'#A5CAD4', c3:'#9F8F82', c4:'#FFFFFF' };
state.myName = state.myName || '你';
state.myPat = state.myPat || '小脑袋';
state.myAvatar = state.myAvatar || '';
state.homeBg = state.homeBg || '';
state.glassOp = state.glassOp === undefined ? .55 : state.glassOp;
state.glassBlur = state.glassBlur === undefined ? 30 : state.glassBlur;
state.widgetBg = state.widgetBg || '';
state.widgetCustom = state.widgetCustom || '';
state.chars.forEach(c => {
c.cards = Array.isArray(c.cards) ? c.cards : [];
c.replyMin = c.replyMin || 30;
c.replyMax = c.replyMax || 120;
c.status = c.status || { activity:'休息', note:'' };
c.trace = c.trace || { arrived:false, loc:'', doing:'' };
c.tzOffset = (c.tzOffset === undefined) ? rint(-9,9) : c.tzOffset;
c.autoMsg = c.autoMsg !== false;
c.nextAuto = c.nextAuto || 0;
c.avatar = c.avatar || '';
c.remark = c.remark || '';
c.myAvatar = c.myAvatar || '';
c.myNickname = c.myNickname || '';
c.bubble = c.bubble || 'ios';
c.pat = c.pat || '';
c.quoteReply = c.quoteReply !== false;
state.stickers[c.id] = Array.isArray(state.stickers[c.id]) ? state.stickers[c.id] : [];
});
if(!state.chars.some(c => c.id === state.activeId)) state.activeId = state.chars[0]?.id || null;
}

function save(){
try{ localStorage.setItem(KEY, JSON.stringify(state)); }
catch(e){ toast('存储空间不足'); }
}

const getChar = id => state.chars.find(c => c.id === (id || state.activeId));
const dispName = c => (c && (c.remark || c.name)) || '梦角';
const getMyName = c => (c && c.myNickname) || state.myName || '你';

let toastTimer;
function toast(msg){
const t = $('toast'); t.textContent = msg; t.classList.add('show');
clearTimeout(toastTimer);
toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function avaStyle(c){
if(c && c.avatar) return `background-image:url('${c.avatar}')`;
return '';
}
function avaHTML(c, size='a40'){
const s = avaStyle(c);
const ch = (c && c.avatar) ? '' : esc((c?.name || '?').charAt(0));
return `<div class="ava ${size}" style="${s}">${ch}</div>`;
}
function avaEl(c, size){
const d = document.createElement('div');
d.className = 'ava ' + size;
const s = avaStyle(c);
if(s) d.setAttribute('style', s);
else d.textContent = (c.name || '?').charAt(0);
return d;
}
function bindDoubleTap(el, fn){
let last = 0;
el.addEventListener('click', e => {
const now = Date.now();
if(now - last < 340){ e.stopPropagation(); e.preventDefault(); last = 0; fn(); }
else last = now;
});
}

function shade(hex, amt){
let c = hex.replace('#','');
if(c.length === 3) c = c.split('').map(x=>x+x).join('');
const r = clamp(parseInt(c.slice(0,2),16)+amt,0,255);
const g = clamp(parseInt(c.slice(2,4),16)+amt,0,255);
const b = clamp(parseInt(c.slice(4,6),16)+amt,0,255);
return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawCard(char){
let cards = (char.cards || []).concat(state.publicCards || []);
if(!cards.length) return null;
let deck = (state.decks[char.id] || []).filter(t => cards.indexOf(t) !== -1);
if(!deck.length){
deck = cards.slice();
for(let i = deck.length-1; i > 0; i--){
const j = Math.floor(Math.random()*(i+1));
[deck[i], deck[j]] = [deck[j], deck[i]];
}
}
const card = deck.shift();
state.decks[char.id] = deck;
save();
return card;
}

function renderHomeAnn(box){
const today = new Date(); today.setHours(0,0,0,0);
const items = [];
state.anniversaries.forEach(a => {
const c = getChar(a.charId); if(!c) return;
const d = new Date(a.date); d.setHours(0,0,0,0);
const diff = Math.round((d - today) / 86400000);
items.push({ c, a, diff });
});
if(!items.length){ box.style.display = 'none'; box.innerHTML = ''; return; }
items.sort((x,y) => Math.abs(x.diff) - Math.abs(y.diff));
box.style.display = 'flex';
box.innerHTML = items.slice(0, 4).map(it => {
let dayTxt;
if(it.diff === 0) dayTxt = '今天';
else if(it.diff > 0) dayTxt = `还有 ${it.diff} 天`;
else dayTxt = `${Math.abs(it.diff)} 天`;
return `<div class="ann-pill">
${avaHTML(it.c, 'a20')}
<span>${esc(dispName(it.c))}</span>
<span class="num">${dayTxt}</span>
</div>`;
}).join('');
}

function setAction(show, html, onClick){
const b = $('appActionBtn');
if(!show){ b.style.display = 'none'; b.onclick = null; return; }
b.style.display = 'flex'; b.innerHTML = html; b.onclick = onClick;
}

function renderApp(){
const body = $('appBody');
body.innerHTML = ''; body.scrollTop = 0;

const row = document.createElement('div');

const a = avaEl(c, 'a34');
bindDoubleTap(a, () => doPat(c, 'me'));
row.appendChild(a);

const src = c.myAvatar || state.myAvatar;
if(src){
const a = document.createElement('div');
a.className = 'ava a34';
a.style.backgroundImage = `url('${src}')`;
row.appendChild(a);
}
}

if(m.sticker){
const img = document.createElement('img');
img.className = 'sticker-img';
img.src = m.sticker;
row.appendChild(img);
}else{
const b = document.createElement('div');
b.className = 'bubble';

inner += `<div class="quote-block">${esc(m.quote.from)}：${esc(m.quote.text)}</div>`;
}
inner += `<span>${esc(m.text)}</span>`;
b.innerHTML = inner;
row.appendChild(b);

if(m.from === 'them'){
const btn = document.createElement('button');

function doPat(c, who){

function sendMsg(){
const c = getChar(convCharId);
if(!c) return;
const inp = $('cinput');
const text = inp.value.trim();
if(!text) return;
const msg = { from:'me', text, ts:Date.now() };
if(quoteTarget) msg.quote = quoteTarget;
inp.value = ''; inp.style.height = '42px'; inp.placeholder = '';
quoteTarget = null;
(state.msgs[c.id] = state.msgs[c.id] || []).push(msg);
save(); renderMsgs(c); scheduleReply(c);
const sb = $('csend'); if(sb) sb.disabled = true;
}

function sendSticker(dataUrl){
const c = getChar(convCharId);
if(!c) return;
(state.msgs[c.id] = state.msgs[c.id] || []).push({ from:'me', sticker:dataUrl, ts:Date.now() });
save(); renderMsgs(c);
toggleStickers(c, false);
scheduleReply(c);
}

function scheduleReply(c){
const cards = (c.cards || []).concat(state.publicCards || []);
if(!cards.length){ toast(`「${dispName(c)}」还没有字卡`); return; }
const wrap = $('msgs');
if(wrap){
const t = document.createElement('div');
t.className = 'msg them'; t.id = 'typingRow';
t.appendChild(avaEl(c, 'a34'));
const b = document.createElement('div');
b.className = 'bubble typing';
b.innerHTML = `<span class="tlabel">正在输入中</span>
<span class="dots"><span></span><span></span><span></span></span>`;
t.appendChild(b);
wrap.appendChild(t);
wrap.scrollTop = wrap.scrollHeight;
}
const delay = rnd(c.replyMin * 1000, c.replyMax * 1000);
clearTimeout(replyTimer);
replyTimer = setTimeout(() => {
const cur = getChar(c.id);
if(!cur) return;
const pool = state.stickers[cur.id] || [];
const sendStickerBack = pool.length && Math.random() < 0.13;
const replyMsg = { from:'them', ts:Date.now() };
if(sendStickerBack){
replyMsg.sticker = pick(pool);
}else{
const card = drawCard(cur);
if(!card) return;
replyMsg.text = card;
if(cur.quoteReply){
const myMsgs = (state.msgs[cur.id] || []).filter(m => m.from === 'me' && m.text);
if(myMsgs.length && Math.random() < 0.4){
const q = pick(myMsgs);
replyMsg.quote = { from: getMyName(cur), text: q.text };
}
}
}
(state.msgs[cur.id] = state.msgs[cur.id] || []).push(replyMsg);
save();
if(currentApp === 'chat' && convCharId === cur.id){
const tr = $('typingRow'); if(tr) tr.remove();
renderMsgs(cur);
}
}, delay);
}

function toggleStickers(c, force){
const panel = $('stickerPanel');

else panel.classList.remove('show');
}
function renderStickerGrid(c){
const pool = state.stickers[c.id] || [];
$('spCount').textContent = `${pool.length} / ${STICKER_LIMIT}`;
const grid = $('spGrid');
if(!pool.length){
grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:26px 10px;color:var(--ink3);font-size:12px;line-height:1.9">还没有表情包<br>点击下方按钮批量导入吧</div>`;
return;
}
grid.innerHTML = pool.map((s, i) => `
<div class="sp-item" data-i="${i}">
<img src="${s}" alt="">
<div class="del" data-del="${i}">×</div>
</div>`).join('');
grid.querySelectorAll('.sp-item').forEach(el => {
el.onclick = e => {
if(e.target.classList.contains('del')) return;
sendSticker(pool[+el.dataset.i]);
};
});
grid.querySelectorAll('[data-del]').forEach(d => {
d.onclick = e => {
e.stopPropagation();
const i = +d.dataset.del;
if(!confirm('删除这张表情？')) return;
pool.splice(i, 1); save(); renderStickerGrid(c);
};
});
}
function bindStickerImport(){
$('spImport').onclick = () => $('spFile').click();
$('spFile').onchange = e => {
const files = Array.from(e.target.files || []);
e.target.value = '';
if(!files.length) return;
if(files.length > IMPORT_LIMIT){ toast(`单次最多导入 ${IMPORT_LIMIT} 张`); return; }
const c = getChar(convCharId);
if(!c) return;
const pool = state.stickers[c.id] = state.stickers[c.id] || [];
const room = STICKER_LIMIT - pool.length;
if(room <= 0){ toast('表情包已达上限 500 张'); return; }
const use = files.slice(0, room);
let done = 0;
use.forEach(f => {
compressImage(f, 220, .8, url => {
pool.push(url); done++;
if(done === use.length){ save(); renderStickerGrid(c); toast(`已导入 ${use.length} 张`); }
});
});
};
}

let callState = { active:false, c:null, mode:null, timer:null, sec:0 };

function startCall(c, mode){

const ov = $('callOverlay');
const isIncoming = mode === 'incoming';
ov.innerHTML = `

<div class="call-timer" id="callTimer">${isIncoming ? '' : '00:00'}</div>
<div class="call-actions" id="callActions">
${isIncoming ? `
<button class="call-btn decline" id="callDecline">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>
</button>
<button class="call-btn accept" id="callAccept">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>
</button>` : `
<button class="call-btn decline" id="callEnd">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>
</button>`}
</div>`;
ov.classList.add('show');
if(isIncoming){
$('callAccept').onclick = () => activateCall(c);
$('callDecline').onclick = () => endCall(c, 'declined');
}else{
$('callEnd').onclick = () => endCall(c, 'outgoing-end');
setTimeout(() => { if(callState.active && callState.mode === 'outgoing') activateCall(c); }, 2200);
}
}

function activateCall(c){
callState.mode = 'active'; callState.sec = 0;
const sub = $('callOverlay').querySelector('.call-sub');
if(sub) sub.textContent = '通话中';
const actions = $('callActions');
if(actions){
actions.innerHTML = `<button class="call-btn decline" id="callEnd">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>
</button>`;
$('callEnd').onclick = () => endCall(c, 'ended');
}
clearInterval(callState.timer);
callState.timer = setInterval(() => {
callState.sec++;
const el = $('callTimer'); if(el) el.textContent = fmtClock(callState.sec);
}, 1000);
const el = $('callTimer'); if(el) el.textContent = '00:00';
setTimeout(() => {
if(callState.active && callState.mode === 'active' && c.cards.length){
toast(`「${dispName(c)}」：${pick(c.cards)}`);
}
}, rnd(4000, 9000));
}

function endCall(c, reason){
clearInterval(callState.timer);
$('callOverlay').classList.remove('show');
const sec = callState.sec;
callState = { active:false, c:null, mode:null, timer:null, sec:0 };
if(!c) return;
state.msgs[c.id] = state.msgs[c.id] || [];
let sysText;
if(reason === 'declined') sysText = `已拒绝「${dispName(c)}」的来电`;
else if(reason === 'outgoing-end') sysText = `未接通「${dispName(c)}」`;
else sysText = `通话结束 · 时长 ${fmtClock(sec)}`;
state.msgs[c.id].push({ from:'system', text:sysText, ts:Date.now() });
save();
if(currentApp === 'chat' && convCharId === c.id) renderMsgs(c);
showCallEnded(c, sec, reason);
}

function showCallEnded(c, sec, reason){
const box = $('callEnded');
const durStr = sec > 0 ? fmtClock(sec) : '';
let label = reason === 'declined' ? '已拒绝' : reason === 'outgoing-end' ? '未接通' : '通话结束';
box.innerHTML = `
<div class="ava ce-ava" style="${avaStyle(c)}">${c.avatar ? '' : esc((c.name||'?').charAt(0))}</div>
<div class="ce-name">${esc(dispName(c))}</div>
<div class="ce-info">${label}${durStr ? ' · ' + durStr : ''}</div>
<button class="ce-btn" id="ceOk">好</button>`;
box.classList.add('show');
setTimeout(() => {
const ok = $('ceOk');
if(ok) ok.onclick = () => box.classList.remove('show');
}, 50);
setTimeout(() => box.classList.remove('show'), 4000);
}

function fmtClock(s){
s = Math.max(0, Math.round(s));
return `${pad2(Math.floor(s/60))}:${pad2(s%60)}`;
}

function compressImage(file, max, quality, cb){
const r = new FileReader();
r.onload = e => {
const img = new Image();
img.onload = () => {
const sc = Math.min(max/img.width, max/img.height, 1);
const w = Math.max(1, Math.round(img.width * sc));
const h = Math.max(1, Math.round(img.height * sc));
const cv = document.createElement('canvas');
cv.width = w; cv.height = h;
cv.getContext('2d').drawImage(img, 0, 0, w, h);
cb(cv.toDataURL('image/jpeg', quality));
};
img.onerror = () => toast('图片读取失败');
img.src = e.target.result;
};
r.readAsDataURL(file);
}

function fmtDur(s){
s = Math.round(s);
if(s < 60) return s + '秒';
const m = Math.floor(s/60), sec = s%60;
return sec ? `${m}分${sec}秒` : `${m}分钟`;
}

const TAROT_MAJOR = [

['正义','公平、因果、真相','不公、逃避责任、失衡'],

['死神','结束与新生、蜕变','抗拒改变、停滞、恐惧'],
['节制','平衡、调和、耐心','失衡、极端、缺乏耐心'],
['恶魔','束缚、欲望、执念','解脱、觉醒、挣脱'],
['塔','剧变、崩塌、真相揭露','避免灾难、延迟的崩塌'],
['星星','希望、疗愈、指引','失望、迷茫、信心不足'],
['月亮','幻觉、不安、潜意识','真相浮现、恐惧消散'],
['太阳','成功、喜悦、生命力','暂时的阴霾、过度乐观'],
['审判','觉醒、召唤、重生','自我怀疑、逃避召唤'],
['世界','完成、圆满、整合','未完成、缺乏闭环']
];
const SUITS = [
{ n:'权杖', t:'行动、热情、创造' },
{ n:'圣杯', t:'情感、关系、直觉' },
{ n:'宝剑', t:'思维、沟通、挑战' },
{ n:'星币', t:'物质、工作、身体' }
];
const RANKS = ['一','二','三','四','五','六','七','八','九','十','侍从','骑士','王后','国王'];
const RANK_KW = ['新起点','平衡抉择','初步成果','稳定根基','冲突挑战','和谐互助','坚持评估','快速推进','接近完成','圆满重负','学习尝试','勇往直前','成熟关怀','权威掌握'];

function buildFullDeck(){
const deck = [];
TAROT_MAJOR.forEach((m,i) => deck.push({ name:`${i} · ${m[0]}`, up:m[1], rev:m[2] }));
SUITS.forEach(s => RANKS.forEach((r,i) => deck.push({
name:`${s.n}${r}`, up:`${s.t} · ${RANK_KW[i]}`, rev:`${s.t} 的阻滞 · ${RANK_KW[i]}受阻`
})));
return deck;
}
const SPREADS = { 3:['过去','现在','未来'], 5:['现状','阻碍','建议','助力','结果'] };
let tarotState = { count:3, deck:[], picked:[], revealed:false };

function renderTarot(body){
$('appTitle').textContent = '塔罗';
body.innerHTML = `
<div class="hint" style="text-align:center;margin-bottom:10px">78张完整牌库 · 左右滑动扇形抽牌</div>
<div class="row" style="justify-content:center;gap:10px;margin-bottom:10px">
<button class="chip ${tarotState.count === 3 ? 'on' : ''}" data-sp="3">三张牌</button>
<button class="chip ${tarotState.count === 5 ? 'on' : ''}" data-sp="5">五张牌</button>
</div>
<div id="tarotArea"></div>`;
body.querySelectorAll('[data-sp]').forEach(b => {
b.onclick = () => {
tarotState = { count:+b.dataset.sp, deck:[], picked:[], revealed:false };
renderTarot(body);
};
});
drawTarotArea(body);
}

function drawTarotArea(body){
const area = $('tarotArea');
if(!tarotState.deck.length && !tarotState.revealed){
area.innerHTML = `<div style="text-align:center;padding:30px 0 10px">
<button class="btn primary" id="tShuffle">✦ 洗 牌 ✦</button></div>`;
$('tShuffle').onclick = () => {
tarotState.deck = buildFullDeck().sort(() => Math.random() - .5);
tarotState.picked = [];
tarotState.revealed = false;
drawTarotArea(body);
};
return;
}
const need = tarotState.count;
const pickedN = tarotState.picked.length;

let html = `<div class="hint" style="text-align:center">左右滑动，点击牌背选 ${need} 张 · 已选 ${pickedN}/${need}</div>`;
html += `<div class="tarot-fan-wrap" id="fanWrap"><div class="tarot-fan" id="fan">`;
tarotState.deck.forEach((card, i) => {
const pi = tarotState.picked.indexOf(i);
const x = i * 42;
html += `<div class="fan-card ${pi !== -1 ? 'picked' : ''}" data-i="${i}" style="left:${x}px">${pi !== -1 ? (pi+1) : '✦'}</div>`;
});
html += `</div></div>`;
if(pickedN === need && !tarotState.revealed){
html += `<div style="text-align:center;margin-top:8px"><button class="btn primary" id="tReveal">翻 牌 解 读</button></div>`;
}
if(tarotState.revealed){
html += '<div class="spread-result">';
tarotState.picked.forEach((deckIdx, pos) => {
const card = tarotState.deck[deckIdx];
const rev = card._rev;
html += `<div class="tr-item">
<div class="reveal-card">${esc(card.name)}${rev ? '<div class="rev">逆</div>' : ''}</div>
<div style="flex:1;min-width:0">
<div class="pos">${SPREADS[need][pos]}</div>
<div class="nm">${esc(card.name)} <span style="font-size:10.5px;color:${rev ? '#A68A8A' : '#5FBF9A'};margin-left:5px">${rev ? '逆位' : '正位'}</span></div>
<div class="tx">${esc(rev ? card.rev : card.up)}</div>
</div></div>`;
});
html += `<div class="hint" style="margin-top:10px;text-align:center">牌面仅供参考，决定权永远在你手里 ✦</div></div>`;
}
area.innerHTML = html;

if(!tarotState.revealed){
area.querySelectorAll('.fan-card[data-i]').forEach(el => {
el.onclick = () => {
const i = +el.dataset.i;
const idx = tarotState.picked.indexOf(i);
if(idx !== -1) tarotState.picked.splice(idx, 1);
else if(tarotState.picked.length < need) tarotState.picked.push(i);
else { toast(`最多选 ${need} 张`); return; }
drawTarotArea(body);
};
});
const rb = $('tReveal');
if(rb) rb.onclick = () => {
tarotState.picked.forEach(i => { tarotState.deck[i]._rev = Math.random() < 0.38; });
tarotState.revealed = true;
drawTarotArea(body);
};
}
}

/* ============================================================
日历（iOS风格 · 完整还原）

let calCursor = new Date();
let calSelected = new Date();

function renderCalendar(body){
$('appTitle').textContent = '日历';
const y = calCursor.getFullYear(), m = calCursor.getMonth();
const startDow = new Date(y, m, 1).getDay();
const daysInMonth = new Date(y, m+1, 0).getDate();
const daysInPrev = new Date(y, m, 0).getDate();
const today = new Date(); today.setHours(0,0,0,0);
const sel = new Date(calSelected.getFullYear(), calSelected.getMonth(), calSelected.getDate());
const dows = ['日','一','二','三','四','五','六'];
const marks = {};
const addMark = (day, item) => { (marks[day] = marks[day] || []).push(item); };
state.anniversaries.forEach(a => {
const d = new Date(a.date);
if(d.getMonth() === m) addMark(d.getDate(), { type:'ann' });
});
state.letters.forEach(l => {
const d = new Date(l.date);
if(d.getFullYear() === y && d.getMonth() === m) addMark(d.getDate(), { type:'letter' });
});

let html = `<div class="ios-cal">
<div class="ios-cal-head">
<div class="ios-cal-title">
<span class="ios-cal-year">${y}年</span>
<span class="ios-cal-month">${m+1}月</span>
</div>
<div class="ios-cal-nav">
<button id="calPrev">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<button id="calNext">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>
</div>
</div>
<div class="ios-cal-dow-row">
${dows.map((d,i) => `<div class="ios-cal-dow ${i===0||i===6?'we':''}">${d}</div>`).join('')}
</div>
<div class="ios-cal-grid">`;

for(let i=startDow-1; i>=0; i--){
html += `<div class="ios-cal-day out"><span class="num">${daysInPrev - i}</span></div>`;
}
for(let d=1; d<=daysInMonth; d++){
const dateObj = new Date(y, m, d);
const isToday = dateObj.getTime() === today.getTime();
const isSel = dateObj.getTime() === sel.getTime();
const dow = dateObj.getDay();
const mk = marks[d] || [];
const dots = mk.length ? `<span class="dots">${mk.slice(0,3).map(() => '<i></i>').join('')}</span>` : '';
const cls = ['ios-cal-day'];
if(isToday) cls.push('today');
else if(isSel) cls.push('sel');
if(dow === 0 || dow === 6) cls.push('we');
html += `<div class="${cls.join(' ')}" data-day="${d}">
<span class="num">${d}</span>${dots}
</div>`;
}
const totalCells = startDow + daysInMonth;
const trailing = (7 - totalCells % 7) % 7;
for(let d=1; d<=trailing; d++){
html += `<div class="ios-cal-day out"><span class="num">${d}</span></div>`;
}
html += '</div>';

/* 下方日程区 */
const selY = sel.getFullYear(), selM = sel.getMonth(), selD = sel.getDate();
const weekLabel = ['周日','周一','周二','周三','周四','周五','周六'][sel.getDay()];
const isSelToday = sel.getTime() === today.getTime();
const agendaItems = [];
state.anniversaries.forEach(a => {
const d = new Date(a.date);
if(d.getMonth() === selM && d.getDate() === selD){
const c = getChar(a.charId);
agendaItems.push({
color:'#D08A95',
title: a.title,
sub: (isSelToday ? '今天 · ' : '') + (c ? `关联 ${dispName(c)}` : '纪念日')
});
}
});
state.letters.forEach(l => {
const d = new Date(l.date);
if(d.getFullYear() === selY && d.getMonth() === selM && d.getDate() === selD){
const c = getChar(l.charId);
agendaItems.push({
color:'var(--accent)',
title: l.title || '无题',
sub: (c ? `${dispName(c)} · ` : '') + (l.reply ? '已回信' : '等待回信中')
});
}
});

html += `<div class="ios-cal-agenda">
<div class="agenda-head">${selM+1}月${selD}日 · ${weekLabel}${isSelToday?' · 今天':''}</div>`;
if(!agendaItems.length){
html += `<div class="agenda-empty">这一天还没有安排</div>`;
}else{
html += agendaItems.map(it => `
<div class="agenda-item" style="border-left-color:${it.color}">
<div style="flex:1;min-width:0">
<div class="agenda-title">${esc(it.title)}</div>
<div class="agenda-sub">${esc(it.sub)}</div>
</div>
</div>`).join('');
}
html += '</div></div>';

body.innerHTML = html;

$('calPrev').onclick = () => { calCursor = new Date(y, m-1, 1); renderCalendar(body); };
$('calNext').onclick = () => { calCursor = new Date(y, m+1, 1); renderCalendar(body); };
body.querySelectorAll('.ios-cal-day[data-day]').forEach(el => {
el.onclick = () => {
calSelected = new Date(y, m, +el.dataset.day);
const st = body.scrollTop;
renderCalendar(body);
body.scrollTop = st;
};
});
}

const ACTIVITIES = ['工作','休息','休闲','通勤','吃饭','看书','发呆','散步','听歌','洗澡','睡觉','在忙'];
let nowTimer = null;
function trackForHour(hour){
if(hour < 6)  return { icon:'🌙', text:'深夜 · 大概已经睡了，梦里不知有没有你' };
if(hour < 8)  return { icon:'☀️', text:'清晨 · 刚醒来，可能还在赖床' };
if(hour < 10) return { icon:'🍞', text:'早上 · 在吃早餐或者在去上班的路上' };
if(hour < 12) return { icon:'💼', text:'上午 · 在忙自己的事' };
if(hour < 14) return { icon:'🍜', text:'午间 · 应该去吃饭了' };
if(hour < 17) return { icon:'📖', text:'下午 · 继续工作或发呆' };
if(hour < 19) return { icon:'🌆', text:'傍晚 · 在回家的路上' };
if(hour < 22) return { icon:'🍵', text:'晚上 · 放松时间，也许会想你' };
return { icon:'🛏️', text:'深夜 · 准备休息了' };
}

function renderNow(body){
$('appTitle').textContent = '此间';
clearInterval(nowTimer);
if(!state.chars.length){
body.innerHTML = `<div class="empty"><span class="em">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICONS.now}</svg>
</span>还没有梦角</div>`;
return;
}
const draw = () => {
body.innerHTML = state.chars.map(c => {
const off = c.tzOffset || 0;
const localDate = new Date(Date.now() + off * 3600000);
const hour = localDate.getHours();
const timeStr = `${pad2(hour)}:${pad2(localDate.getMinutes())}`;
const track = trackForHour(hour);
const pct = (hour * 60 + localDate.getMinutes()) / 1440;
const segs = Array.from({length:12}, (_, i) => {
const a = i / 12, b = (i + 1) / 12;
return `<div class="seg ${pct >= a && pct < b ? 'on' : ''}"></div>`;
}).join('');
return `
<div class="now-card" style="margin-bottom:14px">
<div class="now-top">
${avaHTML(c, 'a50')}
<div style="flex:1;min-width:0">
<div style="font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px">${esc(dispName(c))}</div>
<div class="now-meta">${off >= 0 ? '+' : ''}${off} 时区 · ${localDate.getMonth()+1}月${localDate.getDate()}日</div>
</div>
<div class="now-time-big">${timeStr}</div>
</div>
<div class="now-trace"><span class="ti">${track.icon}</span>${track.text}</div>
<div class="now-timeline">${segs}</div>
<div style="font-size:11px;color:var(--ink3);margin-top:8px;text-align:right">
当前状态：${esc(c.status.activity)}${c.status.note ? ' · ' + esc(c.status.note) : ''}
</div></div>`;
}).join('');
};
draw();
nowTimer = setInterval(draw, 60000);
setInterval(() => {
state.chars.forEach(c => {
c.status.activity = pick(ACTIVITIES);
c.status.note = pick(['心情不错','有点累','在想你','刚忙完','安静地待着','有点困','在发呆','心软软的']);
});
save();
if(currentApp === 'now') draw();
renderHome();
}, 2 * 60 * 60 * 1000);
}

</g>
<circle cx="100" cy="100" r="7" class="compass-center"/>

<div class="row" style="margin-top:8px;gap:8px">

style="flex:1;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:9px 13px;font-size:12.5px;color:var(--ink)"></div>

}).join('');

let focusState = { charId:null, total:25*60, left:0, running:false, timer:null, msgTimer:null };
function renderFocus(body){
$('appTitle').textContent = '陪伴';
const f = focusState;
body.innerHTML = `
<div class="timer-wrap">
${!f.charId ? `
<div class="hint" style="text-align:center;margin-bottom:16px;font-size:13.5px;color:var(--ink)">今天选择谁来陪伴你呢？</div>
<div style="width:100%;display:flex;flex-direction:column;gap:9px">
${state.chars.map(c => `
<div class="chat-row" data-pick="${c.id}" style="background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:18px">
${avaHTML(c, 'a40')}
<div class="info"><div class="nm">${esc(dispName(c))}</div><div class="pv">${c.cards.length} 张字卡</div></div>
</div>`).join('') || '<div class="empty">还没有梦角</div>'}
</div>` : `
<div class="timer-ring">
<svg width="212" height="212">
<defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#CAE0E8"/><stop offset="100%" stop-color="#4E7A8A"/>
</linearGradient></defs>
<circle class="track" cx="106" cy="106" r="96"/>
<circle class="bar" id="ringBar" cx="106" cy="106" r="96" stroke-dasharray="${2*Math.PI*96}" stroke-dashoffset="0"/>
</svg>
<div class="timer-txt">
<div class="tt" id="focusTime">${fmtClock2(f.left || f.total)}</div>
<div class="ts">${f.running ? '专 注 中' : '准 备 好 了'}</div>
</div></div>
<div class="dur-chips">
${[15,25,45,60,90].map(m => `<button class="chip ${f.total === m*60 ? 'on' : ''}" data-min="${m}">${m} 分钟</button>`).join('')}
</div>
<div class="row" style="gap:10px;justify-content:center">
<button class="btn primary" id="focusStart">${f.running ? '暂停' : '开始专注'}</button>
<button class="btn ghost" id="focusReset">重来</button>
<button class="btn ghost" id="focusEnd">换人</button>
</div>
<div id="focusMsg" style="width:100%"></div>`}
</div>`;
body.querySelectorAll('[data-pick]').forEach(el => {
el.onclick = () => { focusState.charId = el.dataset.pick; focusState.left = focusState.total; renderFocus(body); };
});
body.querySelectorAll('[data-min]').forEach(b => {
b.onclick = () => {
if(focusState.running) return;
focusState.total = +b.dataset.min * 60;
focusState.left = focusState.total;
renderFocus(body);
};
});
const st = $('focusStart');
if(st) st.onclick = () => {
if(!focusState.charId) return;
if(focusState.running) pauseFocus(); else startFocus(body);
renderFocus(body);
};
const rs = $('focusReset');
if(rs) rs.onclick = () => { pauseFocus(); focusState.left = focusState.total; renderFocus(body); };
const en = $('focusEnd');
if(en) en.onclick = () => { pauseFocus(); focusState.charId = null; focusState.left = 0; renderFocus(body); };
if(focusState.left === 0 && focusState.charId) focusState.left = focusState.total;
updateRing();
}
function fmtClock2(s){
s = Math.max(0, Math.round(s));
return `${pad2(Math.floor(s/60))}:${pad2(s%60)}`;
}
function updateRing(){
const bar = $('ringBar'), tt = $('focusTime');
if(!bar) return;
const C = 2 * Math.PI * 96;
const pct = focusState.total ? focusState.left / focusState.total : 0;
bar.setAttribute('stroke-dashoffset', String(C * (1 - pct)));
if(tt) tt.textContent = fmtClock2(focusState.left);
}
function startFocus(body){
const c = getChar(focusState.charId);
if(!c) return;
focusState.running = true;
clearInterval(focusState.timer);
focusState.timer = setInterval(() => {
focusState.left--;
updateRing();
if(focusState.left <= 0){
clearInterval(focusState.timer);
focusState.running = false;
focusState.left = 0;
speakFocus('专注结束啦，你真的很棒。');
toast('专注完成 ✦');
if(currentApp === 'focus') renderFocus(body);
}
}, 1000);
const say = () => {
if(!focusState.running) return;
speakFocus(drawCard(getChar(focusState.charId)) || '我一直都在。');
focusState.msgTimer = setTimeout(say, rnd(60000, 180000));
};
focusState.msgTimer = setTimeout(say, rnd(20000, 45000));
toast(`「${dispName(c)}」开始陪伴你专注`);
}
function pauseFocus(){
focusState.running = false;
clearInterval(focusState.timer);
clearTimeout(focusState.msgTimer);
}
function speakFocus(text){
const el = $('focusMsg');
if(!el) return;
const c = getChar(focusState.charId);
el.innerHTML = `<div class="companion-say">
<div class="row" style="gap:9px;margin-bottom:9px">
${c ? avaHTML(c, 'a26') : ''}
<span style="font-size:10.5px;color:var(--accent);letter-spacing:1.4px;font-weight:700">${c ? esc(dispName(c)).toUpperCase() : ''}</span>
</div>${esc(text)}</div>`;
}

/* ---- 气泡编辑器 ---- */
function normalizeCSS(s){
s = String(s || '').trim();
if(!s) return '';
// 若最后没有 ; 或 }，补一个 ;
if(!/[;}]\s*$/.test(s)) s += ';';
// 简单兼容：把换行转为空格，去掉多余空白
s = s.replace(/\n+/g, ' ').replace(/\s{2,}/g, ' ');
return s;
}

function openBubbleEditor(idx){
const isNew = idx === null;
const b = isNew
? { id:'bub' + Date.now().toString(36), name:'新气泡',
	me:'background: linear-gradient(150deg, #A5CAD4, #4E7A8A); color: #fff; border-radius: 18px;',
	them:'background: rgba(255,255,255,.9); color: #2F3E46; border-radius: 18px;' }
: state.bubbles[idx];

openSheet(`
<h3>${isNew ? '新建气泡' : '编辑气泡'}</h3>
<div class="field"><label>名称</label>
<input type="text" id="bubName" value="${esc(b.name)}" maxlength="20" placeholder="气泡名字"></div>

<div class="field"><label>我的气泡</label>
<textarea class="code-area" id="bubMe" rows="4" placeholder="例：background: #4E7A8A; color: #fff; border-radius: 18px; border-bottom-right-radius: 7px;">${esc(b.me || '')}</textarea></div>

<div class="field"><label>梦角的气泡</label>
<textarea class="code-area" id="bubThem" rows="4" placeholder="例：background: #fff; color: #2F3E46; border-radius: 18px; border-bottom-left-radius: 7px;">${esc(b.them || '')}</textarea></div>

<div class="field"><label>预览</label>
<div class="bubble-editor-preview" id="bubPreview">
<div class="row-preview me"><div class="pv-bubble" id="prevMe">我的消息气泡</div></div>
<div class="row-preview them"><div class="pv-bubble" id="prevThem">梦角的消息气泡</div></div>
</div></div>

<div class="sheet-actions">
${isNew ? '' : `<button class="btn danger" id="bubDel">删除</button>`}
<div class="sp"></div>
<button class="btn ghost" id="bubCancel">取消</button>
<button class="btn primary" id="bubSave">保存</button>
</div>`);

const updPreview = () => {
const meCss = normalizeCSS($('bubMe').value);
const themCss = normalizeCSS($('bubThem').value);
const styleId = 'bub-preview-style';
let st = document.getElementById(styleId);
if(st) st.remove();
st = document.createElement('style');
st.id = styleId;
st.textContent =
`#prevMe{${meCss || 'background:linear-gradient(150deg,var(--c2),var(--accent));color:#fff;border-radius:18px;border-bottom-right-radius:7px;'}}
#prevThem{${themCss || 'background:rgba(255,255,255,.9);color:var(--ink);border-radius:18px;border-bottom-left-radius:7px;border:1px solid rgba(255,255,255,.95);'}}`;
document.head.appendChild(st);
};
$('bubMe').oninput = updPreview;
$('bubThem').oninput = updPreview;
updPreview();

$('bubCancel').onclick = closeSheet;
if($('bubDel')) $('bubDel').onclick = () => {
state.bubbles.splice(idx, 1);
save(); closeSheet(); injectBubbleStyles(); renderThemePanel($('appBody'));

$('bubSave').onclick = () => {
const name = $('bubName').value.trim() || '气泡';

state.bubbles.push({ id: b.id, name, me, them });

state.bubbles[idx].name = name;

state.bubbles[idx].them = them;

function injectBubbleStyles(){
document.querySelectorAll('style[data-bub]').forEach(s => s.remove());
state.bubbles.forEach(b => {
const st = document.createElement('style');
st.setAttribute('data-bub', b.id);
let css = '';
if(b.me) css += `.msgs.bs-${b.id} .msg.me .bubble{${b.me}}\n`;
if(b.them) css += `.msgs.bs-${b.id} .msg.them .bubble{${b.them}}\n`;
st.textContent = css;
document.head.appendChild(st);
});
}

/* ============================================================
备忘录（iOS风格）
============================================================ */
let memoEditing = null;
function renderMemo(body){
$('appTitle').textContent = '备忘录';
if(memoEditing){
return renderMemoEdit(body);
}
setAction(true,
`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
() => { memoEditing = { id:null, title:'', body:'', date:Date.now() }; renderMemo(body); });

if(!state.memos.length){
body.innerHTML = `<div class="empty"><span class="em">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
</span>还没有备忘录<br>点击右上角 ＋ 写一条</div>`;
return;
}
const list = state.memos.slice().sort((a,b) => (b.date||0) - (a.date||0));
body.innerHTML = '<div class="memo-list">' + list.map(m => {
const preview = (m.body || '').split('\n').filter(Boolean)[0] || '无其他文本';
const d = new Date(m.date);
return `<div class="memo-item" data-id="${m.id}">
<div class="mt">${esc(m.title || '无标题')}</div>
<div class="mp">${esc(preview)}</div>
<div class="md">${d.toLocaleDateString('zh-CN')} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</div>
</div>`;
}).join('') + '</div>';
body.querySelectorAll('.memo-item').forEach(el => {
el.onclick = () => {
const m = state.memos.find(x => x.id === el.dataset.id);
if(!m) return;
memoEditing = JSON.parse(JSON.stringify(m));
renderMemo(body);
};
});
}

function renderMemoEdit(body){
const m = memoEditing;
$('appTitle').textContent = '';
setAction(true,
`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
<path d="M17 21v-8H7v8M7 3v5h8"/></svg>`,
() => saveMemo(body));

body.innerHTML = `
<div class="memo-toolbar">
<button id="memoBack" style="background:none;border:none;cursor:pointer;color:var(--accent);font-size:14px">‹ 备忘录</button>
<div class="sp" style="flex:1"></div>
<svg id="memoDelete" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
</svg>
</div>
<input type="text" class="memo-edit-title" id="memoTitle" value="${esc(m.title)}" placeholder="标题">
<textarea class="memo-edit-body" id="memoBody" placeholder="开始写...">${esc(m.body)}</textarea>
`;
$('memoTitle').oninput = e => { m.title = e.target.value; };
$('memoBody').oninput = e => { m.body = e.target.value; };
$('memoBack').onclick = () => saveMemo(body, true);
$('memoDelete').onclick = () => {
if(!m.id){ memoEditing = null; renderMemo(body); return; }
if(!confirm('删除这条备忘录？')) return;
state.memos = state.memos.filter(x => x.id !== m.id);
save(); memoEditing = null; renderMemo(body);
};
setTimeout(() => {
if(!m.id && !m.title && !m.body) $('memoTitle').focus();
}, 80);
}

function saveMemo(body, back){
const m = memoEditing;
if(!m) return;
if(!m.title.trim() && !m.body.trim()){
memoEditing = null; renderMemo(body); return;
}
if(m.id){
const idx = state.memos.findIndex(x => x.id === m.id);
if(idx >= 0) state.memos[idx] = { ...m, date: Date.now() };
}else{
state.memos.push({ id: uid(), title: m.title.trim() || '无标题', body: m.body, date: Date.now() });
}
save();
if(back){ memoEditing = null; renderMemo(body); }
else toast('已保存');
}

let homePopTimer = null;
const POP_TYPES = [
{ t:'查手机', m:'想看看你在做什么...' },
{ t:'想聊天', m:'突然很想和你说说话。' },
{ t:'查手机', m:'手机拿过来一下？' },
{ t:'想聊天', m:'在忙吗？想你了。' },
{ t:'查手机', m:'让我看看你在和谁聊天～' },
{ t:'想聊天', m:'陪我一会儿好不好？' }
];
function scheduleHomePop(){
clearTimeout(homePopTimer);
homePopTimer = setTimeout(() => {
if(currentApp === null && !$('mask').classList.contains('show') && !callState.active && state.chars.length){
showHomePop();
}
scheduleHomePop();
}, rnd(70000, 210000));
}
function showHomePop(){
const c = pick(state.chars); if(!c) return;
const p = pick(POP_TYPES);
const type = (p.t === '查手机' && !(state.msgs[c.id] || []).length) ? { t:'想聊天', m:'在吗？想找你聊聊天。' } : p;
const el = document.createElement('div');
el.className = 'home-pop';
el.innerHTML = `
${avaHTML(c, 'a50')}
<div class="info">
<div class="pn">${esc(dispName(c))}</div>
<div class="pm">${type.t} · ${esc(type.m)}</div>
</div>
<div class="close" data-x>×</div>`;
$('viewHome').appendChild(el);
el.onclick = e => {
if(e.target.hasAttribute('data-x')){ el.remove(); return; }
el.remove();
openApp('chat');
setTimeout(() => { convCharId = c.id; renderApp(); }, 200);
};
setTimeout(() => { if(el.parentNode) el.remove(); }, 12000);
}

/* ============================================================
主动消息 / 主动来电
============================================================ */
function checkAuto(){
const now = Date.now();
let changed = false;
state.chars.forEach(c => {
if(!c.autoMsg) return;
if((!c.cards || !c.cards.length) && !state.publicCards.length) return;
if(!c.nextAuto || c.nextAuto < now - 86400000){
c.nextAuto = now + rnd(Math.max(120000, c.replyMin*3000), Math.max(300000, c.replyMax*3000));
return;
}
if(now >= c.nextAuto){
const pool = state.stickers[c.id] || [];
if(pool.length && Math.random() < 0.12){
(state.msgs[c.id] = state.msgs[c.id] || []).push({ from:'them', sticker: pick(pool), ts:now });
}else{
const card = drawCard(c);
if(card) (state.msgs[c.id] = state.msgs[c.id] || []).push({ from:'them', text:card, ts:now });
}
changed = true;
c.nextAuto = now + rnd(Math.max(120000, c.replyMin*3000), Math.max(300000, c.replyMax*3000));
}
});
if(changed){
save();
if(currentApp === 'chat'){
if(convCharId){
const c = getChar(convCharId);
if(c) renderMsgs(c);
}else renderChat($('appBody'));
}
renderHome();
}
}

let lastCallCheck = 0;
function checkIncomingCall(){
if(callState.active) return;
if(currentApp !== null) return;
if(!state.chars.length) return;
const now = Date.now();
if(now - lastCallCheck < 90000) return;
lastCallCheck = now;
if(Math.random() > 0.28) return;
const pool = state.chars.filter(c => c.autoMsg);
if(!pool.length) return;
const c = pick(pool);
startCall(c, 'incoming');
}

function tickTime(){
const d = new Date();
$('sbTime').textContent = `${d.getHours()}:${pad2(d.getMinutes())}`;
}

function init(){
load();
applyTheme();
applyHomeBg();
applyWidgetBg();
injectBubbleStyles();
tickTime();
setInterval(tickTime, 15000);
renderHome();

$('backBtn').onclick = () => {
if(memoEditing){ saveMemo($('appBody'), true); return; }
if(convCharId){ convCharId = null; renderApp(); }
else closeApp();
};
$('gearBtn').onclick = () => {
currentApp = 'settings';
convCharId = null;
memoEditing = null;
$('viewHome').classList.add('hidden');
$('viewApp').classList.add('active');
renderApp();
};
$('spClose').onclick = () => {
const c = getChar(convCharId);
if(c) toggleStickers(c, false);
};
bindStickerImport();

$('dock').querySelectorAll('.dock-btn').forEach(b => {
b.onclick = () => {
const app = b.dataset.dock;
currentApp = app;
convCharId = null;
memoEditing = null;
$('viewHome').classList.add('hidden');
$('viewApp').classList.add('active');
renderApp();
};
});

window.addEventListener('popstate', () => { if(currentApp) closeApp(); });
setInterval(checkAuto, 20000);
setTimeout(checkAuto, 3000);
setInterval(checkIncomingCall, 45000);
scheduleHomePop();
}

init();
</script>
